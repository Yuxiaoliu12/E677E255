[project]
name = "eqt677255"
version = "0.1.0"
description = "E677 → E255 counterexample search engine for finite magmas"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
ml = ["torch>=2.0", "tensorboard"]
analysis = ["networkx", "scikit-learn", "matplotlib"]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
